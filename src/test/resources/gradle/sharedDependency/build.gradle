allprojects {
    group = 'org.jfrog.test.gradle.shared'
    version = '1.0-SNAPSHOT'
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
}

project('moda') {
    dependencies {
        implementation 'org.apache.commons:commons-text:1.9'
    }
}

project('modb') {
    dependencies {
        implementation('org.apache.commons:commons-text:1.9') {
            exclude group: 'org.apache.commons', module: 'commons-lang3'
        }
    }
}
